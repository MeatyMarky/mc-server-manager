[package]
name = "mc-server-manager"
version = "0.1.0"
description = "Cross-platform desktop manager for local Minecraft servers"
edition = "2021"
rust-version = "1.80"
default-run = "mc-server-manager"

[lib]
name = "mc_server_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "mc-server-manager"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
dunce = "1.0.5"
flate2 = "1.1.9"
futures-util = "0.3.34"
hex = "0.4.3"
igd-next = { version = "0.17.1", features = ["aio_tokio"] }
md-5 = "0.10.6"
netdev = "0.46.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "charset"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.10.7"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-none", "sqlite", "migrate", "macros", "chrono"] }
sysinfo = "0.36.1"
tar = "0.4.46"
# `protocol-asset` lets the page read cached mod icons from disk; the scope in
# tauri.conf.json limits that to the icon cache folder and nothing else.
tauri = { version = "2.11.5", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-opener = "2.5.4"
tauri-plugin-single-instance = "2.4.3"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
toml = "1.0.7"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ts-rs = "12.0.1"
uuid = { version = "1.20.0", features = ["v4"] }
walkdir = "2.5.0"
zip = "4.2.0"
zstd = "0.13.3"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target."cfg(unix)".dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3.27.0"
