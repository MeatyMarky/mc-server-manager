name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # Tauri's Linux build needs webkit2gtk and friends; the Windows runner
      # already has everything.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # rust-toolchain.toml decides the version, here and on a laptop. CI ran
      # `stable` and this project's author ran `stable` four months apart, and a
      # clippy lint that did not exist locally failed a commit that was green
      # there. `rustup show` installs whatever the file names.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Path handling, folder-name sanitization and detection all run here, so a
      # Windows-only assumption fails on the Linux leg of this matrix.
      - name: Test backend
        working-directory: src-tauri
        run: cargo test

      - name: Verify generated TypeScript bindings are current
        run: git diff --exit-code src/lib/bindings
