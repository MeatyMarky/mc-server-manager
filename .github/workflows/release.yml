name: Release

# Tagged builds only. `v0.2.0` produces installers for both platforms and
# attaches them to a draft release, which a human publishes after checking them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: MSI (WiX) and NSIS. Both are unsigned; see
          # docs/troubleshooting.md for what SmartScreen does about that.
          - os: windows-latest
            args: --bundles msi,nsis
            artifact: windows-installers
          # Linux: .deb for Debian and Ubuntu, AppImage for everything else.
          - os: ubuntu-22.04
            args: --bundles deb,appimage
            artifact: linux-installers

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The build stamps the commit into the binary, so it needs real
          # history rather than a shallow checkout.
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # Pinned by rust-toolchain.toml, so a tag builds with the toolchain the
      # tests were written against.
      - name: Install the pinned toolchain
        run: rustup show

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The tag is what people download; if it disagrees with the version baked
      # into the binary, every bug report after it is misleading.
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: src-tauri
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          test "$crate" = "$tag" || {
            echo "Cargo.toml says $crate but the tag says $tag"
            exit 1
          }

      # The whole gate from ci.yml, in the same order, before anything is
      # bundled. It used to be `cargo test` alone, and that is exactly how
      # v0.1.0 shipped from a commit whose clippy run was failing: the release
      # never checked the things CI was failing on. A tag must not be able to
      # publish what a pull request would have been refused for.
      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Test frontend
        run: pnpm test

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test backend
        working-directory: src-tauri
        run: cargo test

      # `cargo test` is what regenerates these, so it has to run first. A
      # binding that disagrees with its Rust type is a UI reading fields that
      # are no longer there.
      - name: Verify generated TypeScript bindings are current
        run: git diff --exit-code src/lib/bindings

      - name: Build installers
        run: pnpm tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      # The notes are written by hand and live in the repo, so the release says
      # what the version is for rather than listing commit subjects.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Find the notes for this tag
        id: notes
        shell: bash
        run: |
          path="docs/release-notes/${GITHUB_REF_NAME}.md"
          test -f "$path" || {
            echo "No notes at $path. Write them before tagging."
            exit 1
          }
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: artifacts/**/*
