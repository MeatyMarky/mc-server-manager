name: Release

# Tagged builds only. `v0.2.0` produces installers for both platforms and
# attaches them to a draft release, which a human publishes after checking them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows: MSI (WiX) and NSIS. Both are unsigned; see
          # docs/troubleshooting.md for what SmartScreen does about that.
          - os: windows-latest
            args: --bundles msi,nsis
            artifact: windows-installers
          # Linux: .deb for Debian and Ubuntu, AppImage for everything else.
          - os: ubuntu-22.04
            args: --bundles deb,appimage
            artifact: linux-installers

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The build stamps the commit into the binary, so it needs real
          # history rather than a shallow checkout.
          fetch-depth: 0

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # The tag is what people download; if it disagrees with the version baked
      # into the binary, every bug report after it is misleading.
      - name: Check the tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: src-tauri
        run: |
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag="${GITHUB_REF_NAME#v}"
          test "$crate" = "$tag" || {
            echo "Cargo.toml says $crate but the tag says $tag"
            exit 1
          }

      # The gate from CI, repeated here: a tag must not ship something that
      # would have failed a pull request.
      - name: Test backend
        working-directory: src-tauri
        run: cargo test

      - name: Build installers
        run: pnpm tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
